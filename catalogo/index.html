<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" href="EVO.png">
  <meta charset="UTF-8">
  <title>Sitio en Construcción</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Nuestro sitio web está en construcción. Pronto estará disponible.">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #ffffff;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
    }

    .logo {
      width: 180px;
      margin-bottom: 20px;
      animation: fadeIn 1.5s ease;
    }

    .icon {
      font-size: 70px;
      margin-bottom: 15px;
      animation: bounce 2s infinite;
    }

    h1 {
      font-size: 38px;
      letter-spacing: 2px;
      margin-bottom: 10px;
      color: #f39c12;
    }

    p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }

    .loader {
      width: 100%;
      height: 6px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
    }

    .loader::before {
      content: "";
      display: block;
      height: 100%;
      width: 40%;
      background: #f39c12;
      animation: loading 2s infinite;
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #888;
    }

    @keyframes loading {
      0% { margin-left: -40%; }
      100% { margin-left: 100%; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- LOGO -->
    <img 
      src="https://lh3.googleusercontent.com/d/1Iyl0KiE1H7hR7ZeWsBmlZ94M9IXvnwr3" 
      alt="Logo" 
      class="logo"
    >

    <div class="icon">🚧</div>

    <h1>SITIO EN CONSTRUCCIÓN</h1>
    <p>Estamos trabajando para traerte algo increíble.<br>¡Gracias por tu visita!</p>

    <div class="loader"></div>

    <footer>
      © 2026 - Todos los derechos reservados
    </footer>

  </div>

</body>
</html>
