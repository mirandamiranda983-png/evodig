<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flores Amarillas para Ti 🌻</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts for romantic typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;600;700&family=Sacramento&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --gold-primary: #ffd700;
      --gold-secondary: #ffae00;
      --gold-glow: rgba(255, 215, 0, 0.6);
      --dark-bg: #050508;
    }

    body {
      background-color: var(--dark-bg);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      user-select: none;
      -webkit-user-select: none;
    }

    .font-romantic {
      font-family: 'Dancing Script', cursive;
    }

    .font-cursive {
      font-family: 'Sacramento', cursive;
    }

    .font-handwriting {
      font-family: 'Caveat', cursive;
    }

    /* Glow Effects */
    .glow-yellow-text {
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8),
                   0 0 20px rgba(255, 200, 0, 0.6),
                   0 0 30px rgba(255, 175, 0, 0.4);
    }

    .glow-yellow-box {
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.35),
                  inset 0 0 15px rgba(255, 215, 0, 0.2);
    }

    /* Orbiting Pills Styling */
    .floating-pill {
      position: absolute;
      background: rgba(15, 12, 5, 0.75);
      border: 1px solid rgba(255, 215, 0, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 9999px;
      padding: 6px 16px;
      color: #fffbdf;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.25);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }

    .floating-pill:hover {
      transform: scale(1.1) !important;
      border-color: #ffd700;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
      background: rgba(25, 20, 5, 0.9);
    }

    /* Modal Backdrop Blur and Animations */
    .modal-enter {
      animation: modalFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .modal-exit {
      animation: modalFadeOut 0.4s ease forwards;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.85) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes modalFadeOut {
      from {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
      to {
        opacity: 0;
        transform: scale(0.85) translateY(20px);
      }
    }

    /* Glowing Pulse Effect */
    @keyframes pulseGlow {
      0%, 100% {
        filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.7)) drop-shadow(0 0 35px rgba(255, 180, 0, 0.5));
        transform: scale(1);
      }
      50% {
        filter: drop-shadow(0 0 25px rgba(255, 230, 80, 0.9)) drop-shadow(0 0 50px rgba(255, 190, 0, 0.8));
        transform: scale(1.04);
      }
    }

    .heart-glow-pulse {
      animation: pulseGlow 3s infinite ease-in-out;
    }

    /* Canvas full screen container */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Shimmer Effect for Gold Buttons */
    .btn-gold {
      background: linear-gradient(135deg, #ffd700 0%, #ffaa00 50%, #e69500 100%);
      color: #1a1000;
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
      transition: all 0.3s ease;
    }

    .btn-gold:hover {
      background: linear-gradient(135deg, #ffe033 0%, #ffb71a 50%, #ff9e00 100%);
      box-shadow: 0 6px 28px rgba(255, 215, 0, 0.6);
      transform: translateY(-2px);
    }

    .btn-gold:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body class="relative flex items-center justify-center min-h-screen overflow-hidden">

  <!-- Canvas Background for Galaxy Stars and Floating Sunflowers Particles -->
  <div id="canvas-container">
    <canvas id="spaceCanvas"></canvas>
  </div>

  <!-- Floating Labels / Orbiting Phrase Tags overlay -->
  <div id="floating-tags-container" class="absolute inset-0 pointer-events-none z-10">
    <!-- Dynamically populated via JS -->
  </div>

  <!-- Main Interactive Center HUD -->
  <div class="relative z-20 text-center flex flex-col items-center justify-center p-4 pointer-events-none">
    
    <!-- Central Sunflower SVG / Heart Graphic -->
    <div id="center-flower-btn" class="pointer-events-auto cursor-pointer heart-glow-pulse transition-transform duration-300 hover:scale-110 active:scale-95 group mb-2">
      <svg width="140" height="140" viewBox="0 0 200 200" class="drop-shadow-2xl">
        <defs>
          <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff5a0" />
            <stop offset="50%" stop-color="#ffd700" />
            <stop offset="100%" stop-color="#ff8c00" />
          </radialGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        
        <!-- Outer Glowing Petals Circle -->
        <g transform="translate(100, 100)" filter="url(#glow)">
          <!-- Petal ring -->
          <g id="svg-petals">
            <!-- Rendered by JavaScript or template -->
          </g>

          <!-- Glowing Center Heart -->
          <path d="M 0 -18 C -15 -35, -35 -15, 0 18 C 35 -15, 15 -35, 0 -18 Z" 
                fill="url(#sunGlow)" 
                stroke="#fff" 
                stroke-width="1.5"/>
        </g>
      </svg>
      
      <!-- Label directly under central flower matching video header -->
      <div class="glow-yellow-text text-yellow-300 font-romantic text-3xl sm:text-4xl mt-1 tracking-wider font-bold group-hover:text-white transition-colors">
        Te amo 🌻
      </div>
      <p class="text-xs text-yellow-200/80 tracking-widest uppercase mt-1">Haz clic en la flor</p>
    </div>

  </div>

  <!-- Top Header Bar with Controls -->
  <div class="absolute top-4 left-4 right-4 z-30 flex items-center justify-between pointer-events-auto">
    <!-- Left Title Tag -->
    <div class="flex items-center space-x-2 bg-black/40 backdrop-blur-md px-3 py-1.5 rounded-full border border-yellow-500/30 text-xs text-yellow-200">
      <span class="w-2 h-2 rounded-full bg-yellow-400 animate-ping"></span>
      <span class="font-semibold tracking-wide">Flores Amarillas para Ti 💛</span>
    </div>

    <!-- Audio & Interaction Controls -->
    <div class="flex items-center space-x-2">
      <!-- Music Synthesizer / Audio Toggle -->
      <button id="music-btn" title="Reproducir Música Romántica" class="w-10 h-10 rounded-full bg-black/50 backdrop-blur-md border border-yellow-500/40 text-yellow-300 hover:text-white hover:bg-yellow-500/20 transition flex items-center justify-center">
        <i id="music-icon" class="fas fa-music text-sm"></i>
      </button>

      <!-- Re-open Letter Modal Button -->
      <button id="open-card-btn" title="Abrir Carta de Amor" class="px-3.5 py-1.5 rounded-full btn-gold text-xs flex items-center space-x-1.5">
        <i class="fas fa-envelope-open-text"></i>
        <span>Ver Carta</span>
      </button>
    </div>
  </div>

  <!-- Romantic Letter Card Modal (Matching the yellow card from video timestamp 0:09) -->
  <div id="love-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="modal-card" class="relative w-full max-w-md bg-gradient-to-b from-amber-100 via-yellow-100 to-amber-200 text-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl border-4 border-yellow-300/80 transform transition-all">
      
      <!-- Decorative Flower Sparkle Corner Icons -->
      <div class="absolute top-3 left-3 text-yellow-600/40 text-xl">🌻</div>
      <div class="absolute top-3 right-3 text-yellow-600/40 text-xl">✨</div>
      <div class="absolute bottom-3 left-3 text-yellow-600/40 text-xl">✨</div>
      <div class="absolute bottom-3 right-3 text-yellow-600/40 text-xl">🌻</div>

      <!-- Close Button -->
      <button id="close-modal-x" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-yellow-200/60 text-yellow-900 hover:bg-yellow-300 transition flex items-center justify-center font-bold text-sm">
        ✕
      </button>

      <!-- Modal Card Body Content -->
      <div class="text-center space-y-4 pt-2">
        
        <!-- Header -->
        <h2 class="font-romantic text-4xl sm:text-5xl text-yellow-900 font-bold tracking-wide">
          Mi amor
        </h2>

        <div class="w-16 h-1 bg-yellow-500/40 mx-auto rounded-full"></div>

        <!-- Main Card Text ( exact transcription from video ) -->
        <p class="text-base sm:text-lg text-amber-950 leading-relaxed font-medium px-2 py-1">
          Estas flores amarillas son como tú: <br>
          <span class="font-semibold text-yellow-800">brillantes, radiantes y llenas de alegría.</span>
        </p>

        <p class="text-sm sm:text-base text-amber-900/90 leading-relaxed italic">
          "Gracias por iluminar cada uno de mis días. Eres simplemente hermosa mi Aby ❤️."
        </p>

        <!-- Signature -->
        <div class="pt-2">
          <h3 class="font-romantic text-3xl text-yellow-800 font-bold">
            Te Amo
          </h3>
          <div class="mt-1 inline-block bg-yellow-400/30 border border-yellow-500/40 text-yellow-950 font-bold text-xs px-4 py-1 rounded-full shadow-sm">
            Para Ti 🌻
          </div>
        </div>

        <!-- Action Button -->
        <div class="pt-4">
          <button id="close-modal-btn" class="w-full py-2.5 rounded-xl btn-gold text-sm uppercase tracking-wider font-bold shadow-lg transition">
            Con todo mi amor 💛
          </button>
        </div>

      </div>

    </div>
  </div>

  <script>
    // Canvas setup
    const canvas = document.getElementById('spaceCanvas');
    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;

    // Love Phrases array (matching video pills: "Te amo", "Eres mi todo", "Me encantas", "Eres preciosa", "Amor de mi vida", "Siempre juntos", "Mi Amor", "Te adoro")
    const lovePhrases = [
      "Te Amo 🌻",
      "Eres mi todo 💛",
      "Me encantas ✨",
      "Eres preciosa 🌻",
      "Raquel de miranda 💛",
      "Siempre juntos 🌻",
      "Mi Amor 💛",
      "Te adoro 🌻",
      "My Love 💛",
      "Raquel de Miranda🌟"
    ];

    // Interactive elements logic
    const floatingContainer = document.getElementById('floating-tags-container');
    const loveModal = document.getElementById('love-modal');
    const modalCard = document.getElementById('modal-card');
    const openCardBtn = document.getElementById('open-card-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const closeModalX = document.getElementById('close-modal-x');
    const centerFlowerBtn = document.getElementById('center-flower-btn');
    const musicBtn = document.getElementById('music-btn');
    const musicIcon = document.getElementById('music-icon');

    // Render Petals for SVG Center Flower
    const svgPetalsGroup = document.getElementById('svg-petals');
    const petalCount = 14;
    for (let i = 0; i < petalCount; i++) {
      const angle = (i * 360) / petalCount;
      const petal = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
      petal.setAttribute("cx", "0");
      petal.setAttribute("cy", "-42");
      petal.setAttribute("rx", "11");
      petal.setAttribute("ry", "28");
      petal.setAttribute("fill", "#ffd700");
      petal.setAttribute("stroke", "#ffaa00");
      petal.setAttribute("stroke-width", "1");
      petal.setAttribute("transform", `rotate(${angle})`);
      svgPetalsGroup.appendChild(petal);
    }

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Particle Classes
    class Star {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 0.5;
        this.baseAlpha = Math.random() * 0.7 + 0.3;
        this.alpha = this.baseAlpha;
        this.twinkleSpeed = Math.random() * 0.03 + 0.005;
        this.color = Math.random() > 0.3 ? '#ffffff' : '#ffea79';
      }

      update() {
        this.alpha += Math.sin(Date.now() * this.twinkleSpeed) * 0.01;
        if (this.alpha < 0.1) this.alpha = 0.1;
        if (this.alpha > 1) this.alpha = 1;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class GalaxyParticle {
      constructor() {
        this.reset();
      }

      reset() {
        this.angle = Math.random() * Math.PI * 2;
        this.distance = Math.random() * (Math.min(width, height) * 0.45) + 30;
        this.speed = (0.002 + Math.random() * 0.003) * (Math.random() > 0.5 ? 1 : -1);
        this.size = Math.random() * 2.5 + 1;
        this.alpha = Math.random() * 0.8 + 0.2;
        this.color = Math.random() > 0.4 ? '#ffd700' : '#ff9100';
      }

      update() {
        this.angle += this.speed;
      }

      draw(centerX, centerY) {
        const x = centerX + Math.cos(this.angle) * this.distance;
        const y = centerY + Math.sin(this.angle) * this.distance * 0.55; // Elliptical galaxy tilt

        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(x, y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class FloatingSunflowerParticle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 12 + 10;
        this.speedY = -(Math.random() * 0.6 + 0.2);
        this.speedX = Math.sin(Math.random() * Math.PI) * 0.4;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.02;
        this.alpha = Math.random() * 0.7 + 0.3;
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.01) * 0.5;
        this.rotation += this.rotSpeed;

        if (this.y < -30) {
          this.y = height + 30;
          this.x = Math.random() * width;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.alpha;

        // Draw small flower shape
        const petals = 8;
        ctx.fillStyle = '#ffd700';
        for (let i = 0; i < petals; i++) {
          ctx.rotate((Math.PI * 2) / petals);
          ctx.beginPath();
          ctx.ellipse(0, -this.size * 0.6, this.size * 0.25, this.size * 0.5, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        // Center disc
        ctx.fillStyle = '#5c3a00';
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // Cursor Sparkle Trails
    class SparkleTrail {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 4 + 2;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.life = 1.0;
        this.decay = Math.random() * 0.03 + 0.015;
        this.color = Math.random() > 0.5 ? '#fff3a1' : '#ffd700';
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
      }

      draw() {
        if (this.life <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffd700';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    const stars = Array.from({ length: 120 }, () => new Star());
    const galaxyParticles = Array.from({ length: 180 }, () => new GalaxyParticle());
    const flowers = Array.from({ length: 25 }, () => new FloatingSunflowerParticle());
    let sparkles = [];

    // Interactive mouse trails
    window.addEventListener('mousemove', (e) => {
      if (Math.random() < 0.4) {
        sparkles.push(new SparkleTrail(e.clientX, e.clientY));
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches[0] && Math.random() < 0.4) {
        sparkles.push(new SparkleTrail(e.touches[0].clientX, e.touches[0].clientY));
      }
    });

    // Position phrase tags orbiting around center
    const tagElements = [];
    function createFloatingTags() {
      floatingContainer.innerHTML = '';
      const count = lovePhrases.length;

      lovePhrases.forEach((phrase, index) => {
        const el = document.createElement('div');
        el.className = 'floating-pill';
        el.innerHTML = `<span>${phrase}</span>`;
        
        // Add click interaction to spawn particles and show love modal
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          createBurst(e.clientX, e.clientY);
          openModal();
        });

        floatingContainer.appendChild(el);

        tagElements.push({
          element: el,
          angle: (index * (Math.PI * 2)) / count,
          speed: 0.003 + (index % 3) * 0.001,
          radiusX: 0,
          radiusY: 0
        });
      });
    }

    function updateFloatingTags() {
      const centerX = width / 2;
      const centerY = height / 2;
      const baseRadiusX = Math.min(width, height) * 0.38 + 20;
      const baseRadiusY = baseRadiusX * 0.55;

      tagElements.forEach((item, idx) => {
        item.angle += item.speed;
        
        // Depth simulation
        const x = centerX + Math.cos(item.angle) * baseRadiusX;
        const y = centerY + Math.sin(item.angle) * baseRadiusY;
        const scale = 0.8 + Math.sin(item.angle) * 0.25;
        const zIndex = Math.floor(scale * 100);

        item.element.style.transform = `translate(-50%, -50%) translate3d(${x - centerX}px, ${y - centerY}px, 0px) scale(${scale})`;
        item.element.style.left = `${centerX}px`;
        item.element.style.top = `${centerY}px`;
        item.element.style.zIndex = zIndex;
        item.element.style.opacity = (scale - 0.5) * 1.8;
      });
    }

    createFloatingTags();

    function createBurst(x, y) {
      for (let i = 0; i < 25; i++) {
        sparkles.push(new SparkleTrail(x, y));
      }
    }

    function animate() {
      // Dark space trail clearing
      ctx.fillStyle = 'rgba(5, 5, 8, 0.25)';
      ctx.fillRect(0, 0, width, height);

      const centerX = width / 2;
      const centerY = height / 2;

      // Draw background stars
      stars.forEach(star => {
        star.update();
        star.draw();
      });

      // Draw spiral galaxy core
      galaxyParticles.forEach(gp => {
        gp.update();
        gp.draw(centerX, centerY);
      });

      // Draw floating sunflowers
      flowers.forEach(flower => {
        flower.update();
        flower.draw();
      });

      // Draw sparkles
      sparkles.forEach((s, idx) => {
        s.update();
        s.draw();
        if (s.life <= 0) sparkles.splice(idx, 1);
      });

      // Update positions of orbiting DOM text pills
      updateFloatingTags();

      requestAnimationFrame(animate);
    }

    // Web Audio API Synthesizer for romantic ambient music without external audio files
    let audioCtx = null;
    let isPlayingAudio = false;
    let melodyInterval = null;

    const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25]; // C4 to C5 notes

    function playSoftNote(freq) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 2.6);
      } catch (e) {
        console.error(e);
      }
    }

    function toggleMusic() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (isPlayingAudio) {
        clearInterval(melodyInterval);
        isPlayingAudio = false;
        musicIcon.className = 'fas fa-music text-sm';
        musicBtn.classList.remove('bg-yellow-500/40');
      } else {
        isPlayingAudio = true;
        musicIcon.className = 'fas fa-pause text-sm';
        musicBtn.classList.add('bg-yellow-500/40');

        // Play gentle soft romantic arpeggios
        let step = 0;
        const melodyPattern = [0, 2, 4, 7, 4, 2, 1, 3, 5, 7, 5, 3];
        
        melodyInterval = setInterval(() => {
          const noteIndex = melodyPattern[step % melodyPattern.length];
          playSoftNote(notes[noteIndex]);
          step++;
        }, 450);
      }
    }

    musicBtn.addEventListener('click', toggleMusic);

    function openModal() {
      loveModal.classList.remove('opacity-0', 'pointer-events-none');
      loveModal.classList.add('opacity-100', 'pointer-events-auto');
      modalCard.classList.remove('modal-exit');
      modalCard.classList.add('modal-enter');
    }

    function closeModal() {
      modalCard.classList.remove('modal-enter');
      modalCard.classList.add('modal-exit');
      setTimeout(() => {
        loveModal.classList.remove('opacity-100', 'pointer-events-auto');
        loveModal.classList.add('opacity-0', 'pointer-events-none');
      }, 350);
    }

    centerFlowerBtn.addEventListener('click', (e) => {
      createBurst(e.clientX || width / 2, e.clientY || height / 2);
      openModal();
    });

    openCardBtn.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', closeModal);
    closeModalX.addEventListener('click', closeModal);

    // Close on backdrop click
    loveModal.addEventListener('click', (e) => {
      if (e.target === loveModal) closeModal();
    });

    // Auto open modal on start after brief delay
    window.addEventListener('load', () => {
      animate();
      setTimeout(() => {
        openModal();
      }, 1200);
    });

  </script>
</body>
</html>
